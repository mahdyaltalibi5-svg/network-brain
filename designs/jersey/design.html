<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Manrope:wght@600;700;800&display=block" rel="stylesheet">
<style>
  html,body{margin:0;background:transparent}
  svg{display:block;width:1000px;height:1400px}
  .serif{font-family:'Cormorant Garamond',serif}
  .sans{font-family:'Manrope',sans-serif}
</style></head>
<body>
<svg id="art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400">
  <defs>
    <path id="arch" d="M120,350 A560,560 0 0 1 880,350"/>
    <path id="shield" d="M0,0 H520 V330 Q520,505 260,600 Q0,505 0,330 Z"/>
    <clipPath id="inner"><use href="#shield" transform="translate(262 382) scale(0.9154)"/></clipPath>
  </defs>
  <g fill="none" stroke="none">
    <!-- arched wordmark -->
    <text class="serif" font-weight="700" font-size="168" letter-spacing="22" fill="#F2EDE4">
      <textPath href="#arch" startOffset="50%" text-anchor="middle">SUMMIT</textPath>
    </text>
    <!-- small stars either side of arch -->
    <g fill="#C9A45C">
      <path d="M92,402 l7,15 16,2 -12,11 3,16 -14,-8 -14,8 3,-16 -12,-11 16,-2z"/>
      <path d="M908,402 l7,15 16,2 -12,11 3,16 -14,-8 -14,8 3,-16 -12,-11 16,-2z"/>
    </g>

    <!-- crest -->
    <g transform="translate(240 360)">
      <use href="#shield" stroke="#C9A45C" stroke-width="10"/>
      <use href="#shield" transform="translate(22 22) scale(0.9154)" stroke="#C9A45C" stroke-width="3"/>
    </g>
    <g clip-path="url(#inner)">
      <!-- monogram -->
      <text x="500" y="590" text-anchor="middle" class="serif" font-style="italic" font-weight="700" font-size="230" fill="#C9A45C" letter-spacing="-6">SC</text>
      <!-- Wasatch range -->
      <path d="M240,860 L300,770 L338,800 L392,700 L432,742 L500,628 L560,722 L600,690 L660,778 L700,752 L760,830 V960 H240 Z" fill="#F2EDE4"/>
      <!-- snow-line knocked out as navy shadow facets -->
      <path d="M500,628 L476,708 L500,690 L520,724 Z M392,700 L380,746 L398,738 Z M600,690 L596,730 L614,712 Z" fill="#1d2233"/>
      <!-- the thread: stitched ridge line -->
      <path d="M262,812 L312,740 L346,768 L392,686 L434,728 L500,612 L562,708 L600,672 L664,762 L742,726"
            stroke="#C9A45C" stroke-width="7" stroke-dasharray="20 13" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- needle finishing the thread -->
    <g transform="translate(742 726) rotate(-24)">
      <path d="M0,-5 L92,-3 Q100,0 92,3 L0,5 Q-6,0 0,-5Z" fill="#F2EDE4"/>
      <rect x="10" y="-2" width="20" height="4" rx="2" fill="#1d2233"/>
    </g>

    <!-- banner -->
    <g transform="translate(500 1030)">
      <path d="M-330,-44 H330 L300,0 L330,44 H-330 L-300,0 Z" fill="#C9A45C"/>
      <text y="16" text-anchor="middle" class="sans" font-weight="800" font-size="44" letter-spacing="14" fill="#141826">CUSTOM TAILORING</text>
    </g>

    <!-- city line -->
    <g transform="translate(500 1150)">
      <line x1="-330" y1="0" x2="-200" y2="0" stroke="#C9A45C" stroke-width="3"/>
      <line x1="200" y1="0" x2="330" y2="0" stroke="#C9A45C" stroke-width="3"/>
      <text y="13" text-anchor="middle" class="sans" font-weight="700" font-size="34" letter-spacing="12" fill="#F2EDE4">SALT LAKE CITY</text>
    </g>
    <text x="500" y="1238" text-anchor="middle" class="serif" font-style="italic" font-weight="600" font-size="46" fill="#C9A45C">Made to measure</text>
  </g>
</svg>
</body></html>
